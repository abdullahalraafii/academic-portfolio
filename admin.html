<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Portfolio Admin</title>

<style>

*{box-sizing:border-box}body{margin:0;font:500 14px/1.5 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink)}

#nav button.on{background:var(--acc);color:#fff}#nav button:focus-visible{outline:2px solid #fff}

#top h1{font-size:20px;margin:0;font-weight:800;flex:1;min-width:140px}
#pill{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}#pill b{width:8px;height:8px;border-radius:50%;background:var(--ok)}#pill.dirty b{background:#d98a00}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:9px;font:700 13px Manrope,sans-serif;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:5px 9px;font-size:12px}.btn.d:hover{border-color:var(--bad);color:var(--bad)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#view{padding:24px 28px 80px;max-width:1100px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.sec>h2{margin:0 0 2px;font-size:16px;font-weight:800}.sec>p{margin:0 0 14px;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.w2{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
input[type=text],textarea,select{font:500 14px Manrope,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

.add{margin-top:10px}

.sw{position:relative;width:38px;height:22px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s;pointer-events:none}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i:after{left:19px}
.lr{display:flex;align-items:center;gap:10px;padding:10px 12px}.lr .ct{flex:1;font-weight:700}

@media(max-width:820px){#app{display:block}#side{position:static;height:auto;padding:8px}#nav{display:flex;overflow-x:auto;gap:4px}#nav button{width:auto}.brand{display:none}#top,#view{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

async function boot(){
 try{const d=localStorage.getItem('pf-draft');if(d){D=JSON.parse(d);setPill(1,'Draft restored · not published yet')}}catch(e){}
 if(!D){try{const r=await fetch('data.json?t='+Date.now());if(!r.ok)throw 0;D=await r.json();setPill(0,'Loaded live data.json')}catch(e){$('#ttl').textContent='Open your data';$('#view').innerHTML='<div class="empty"><p><b>Could not load data.json.</b><br>Open this page from your website (not from a file on your computer), or import the file.</p></div>';$('#view').firstChild.append(el('button',{class:'btn p',onclick:()=>$('#fImp').click()},'Import data.json'));setPill(0,'No data loaded');return}}

$('#bImp').onclick=()=>$('#fImp').click();

const gh=$('#gh'),G=JSON.parse(localStorage.getItem('pf-gh')||'{}');
$('#gO').value=G.o||'';$('#gR').value=G.r||'';$('#gB').value=G.b||'main';$('#gT').value=G.t||'';

const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i+=7)h=Math.imul(h^s.charCodeAt(i),16777619);return(h>>>0).toString(16)+s.length.toString(16)};
async function api(path,opt,c){const r=await fetch(`https://api.github.com/repos/${c.o}/${c.r}/contents/${path}`+(opt.method==='GET'?`?ref=${c.b}`:''),{...opt,headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'}});return r}
$('#gGo').onclick=async()=>{const c={o:$('#gO').value.trim(),r:$('#gR').value.trim(),b:$('#gB').value.trim()||'main',t:$('#gT').value.trim()};
 if(!c.o||!c.r||!c.t)return toast('Fill in username, repository and token');
 localStorage.setItem('pf-gh',JSON.stringify(c));const btn=$('#gGo');btn.disabled=true;
 try{let n=0;const seen={};
  const up=async o=>{for(const k in o){const x=o[k];if(typeof x==='string'&&/^data:image\//.test(x)){if(!seen[x]){const m=x.match(/^data:image\/([a-z+]+);base64,(.+)$/i);const ext=m[1].replace('jpeg','jpg').replace('svg+xml','svg'),p='images/'+hash(x)+'.'+ext;
     toast('Uploading picture '+(++n)+'…');
     const r=await api(p,{method:'PUT',body:JSON.stringify({message:'Add picture',content:m[2],branch:c.b})},c);if(!r.ok&&r.status!==422)throw new Error('Picture upload failed ('+r.status+'). Check the token.');seen[x]=p}o[k]=seen[x]}else if(x&&typeof x==='object')await up(x)}};
  await up(D);
  toast('Saving data.json…');
  const g=await api('data.json',{method:'GET'},c);if(!g.ok&&g.status!==404)throw new Error('Could not reach the repository ('+g.status+'). Check the names and token.');
  const sha=g.ok?(await g.json()).sha:undefined,body=JSON.stringify(D,null,1);
  const r=await api('data.json',{method:'PUT',body:JSON.stringify({message:'Update portfolio content',content:btoa(unescape(encodeURIComponent(body))),sha,branch:c.b})},c);
  if(!r.ok)throw new Error('Publish failed ('+r.status+')');
  localStorage.setItem('pf-draft',JSON.stringify(D));setPill(0,'Published · live in about a minute');toast('Published. Your site updates in about a minute.');gh.close();go(cur)
 }catch(e){toast(e.message||'Publish failed')}btn.disabled=false};
